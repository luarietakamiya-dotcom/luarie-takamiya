name: Convert RAB!T member images to PNG

on:
  push:
    paths:
      - '.github/workflows/rabit-images-to-png.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Convert member artwork to PNG
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          base = Path('rab-t/assets')
          for name in ('luarie', 'sena', 'rei'):
              src = base / f'{name}.webp'
              dst = base / f'{name}.png'
              with Image.open(src) as im:
                  im.convert('RGB').save(dst, 'PNG', optimize=True)
              print(name, Image.open(dst).size, dst.stat().st_size)
          PY

      - name: Commit PNG assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rab-t/assets/luarie.png rab-t/assets/sena.png rab-t/assets/rei.png
          if git diff --cached --quiet; then
            echo "No image changes"
          else
            git commit -m "Add PNG versions of RAB!T member artwork"
            git push
          fi
